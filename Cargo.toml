[package]
name        = "manzil"
version     = "0.1.0"
edition     = "2021"
description = "Minimalist home file reconciler"
license     = "MIT"

[[bin]]
name = "manzil"
path = "src/main.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc       = "0.2"
anyhow     = "1"
toml       = "0.8"
serde_yml  = "=0.0.12"
rust-ini   = "0.21"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
