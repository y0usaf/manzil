[package]
name        = "manzil"
version     = "0.1.0"
edition     = "2021"
description = "Minimalist home file reconciler"
license     = "MIT"

[[bin]]
name = "manzil"
path = "src/main.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
libc       = "0.2"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
